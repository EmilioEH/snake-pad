<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Snake Pad — a friendly snake game for little ones">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Snake Pad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🐍 Snake!</h1>
      <button id="modeBtn" type="button" aria-label="Age level">🧒 3–4</button>
      <div id="scoreWrap"><span id="score" role="status" aria-label="0 stars">0</span></div>
    </header>

    <div id="boardWrap">
      <canvas id="game"></canvas>
      <div id="overlay" class="hidden">
        <div id="overlayEmoji" aria-hidden="true"></div>
        <button id="playBtn" type="button" aria-label="Play">▶</button>
        <div id="overlayText"></div>
      </div>
    </div>

    <div id="controls">
      <div id="dpad">
        <button id="upBtn" class="d-btn" aria-label="Up">▲</button>
        <button id="leftBtn" class="d-btn" aria-label="Left">◀</button>
        <div id="dpadCenter" aria-hidden="true">🐍</div>
        <button id="rightBtn" class="d-btn" aria-label="Right">▶</button>
        <button id="downBtn" class="d-btn" aria-label="Down">▼</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
